<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="t1_outer" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="60%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <linearGradient id="t1_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <radialGradient id="t1_core" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer notched medal base -->
  <g filter="url(#glow)">
    <!-- Cardinal notches -->
    <rect x="30" y="2" width="4" height="60" rx="1" fill="#4b5563"/>
    <rect x="2" y="30" width="60" height="4" rx="1" fill="#4b5563"/>
    
    <!-- Outer metallic ring -->
    <circle cx="32" cy="32" r="28" fill="url(#t1_outer)" stroke="url(#t1_rim)" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="23" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Inner dark beveled chamber -->
    <circle cx="32" cy="32" r="19" fill="url(#t1_core)" stroke="#9ca3af" stroke-width="1.2"/>
    
    <!-- Iconic Spiral / Target center glyph -->
    <path d="M 32 17 A 15 15 0 0 1 47 32 A 15 15 0 0 1 32 47 A 15 15 0 0 1 17 32 A 15 15 0 0 1 29 17.5" 
          fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
    <path d="M 32 21 A 11 11 0 0 1 43 32 A 11 11 0 0 1 32 43 A 11 11 0 0 1 21 32 A 11 11 0 0 1 30 21.5" 
          fill="none" stroke="#d1d5db" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="32" cy="32" r="1.8" fill="#1f2937"/>
  </g>
</svg>
