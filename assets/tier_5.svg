<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="t5_ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="t5_gold_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="t5_core" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="30%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#2d0606"/>
    </radialGradient>
    <filter id="t5_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#t5_glow)">
    <!-- Dragon Wing / Grandmaster Golden Frame -->
    <path d="M 32 1 L 44 14 L 63 17 L 54 32 L 62 48 L 46 50 L 38 63 L 32 53 L 26 63 L 18 50 L 2 48 L 10 32 L 1 17 L 20 14 Z" 
          fill="url(#t5_gold_rim)" stroke="#fef08a" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Ruby Shield Core -->
    <polygon points="32,10 49,20 49,42 32,54 15,42 15,20" fill="url(#t5_ruby)" stroke="#fef08a" stroke-width="1.8"/>
    <polygon points="32,14 45,22 45,40 32,50 19,40 19,22" fill="url(#t5_core)" stroke="#fca5a5" stroke-width="1.2"/>
    
    <!-- Radiant Grandmaster Crown Gem -->
    <polygon points="32,20 37,28 45,31 38,36 39,44 32,39 25,44 26,36 19,31 27,28" 
             fill="#ffffff" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="32" cy="33" r="3.2" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
    <circle cx="31" cy="32" r="1" fill="#ffffff"/>
  </g>
</svg>
