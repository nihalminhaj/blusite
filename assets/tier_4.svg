<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="t4_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="t4_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="t4_core" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="t4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#t4_glow)">
    <!-- Ornate Gold Crest Points -->
    <path d="M 32 3 L 42 16 L 58 14 L 52 29 L 61 42 L 45 46 L 39 61 L 32 50 L 25 61 L 19 46 L 3 42 L 12 29 L 6 14 L 22 16 Z" 
          fill="url(#t4_gold)" stroke="url(#t4_rim)" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Inner Octagonal Chamber -->
    <polygon points="32,15 45,21 50,34 45,47 32,53 19,47 14,34 19,21" fill="#18181b" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="32,18 42,23 46,34 42,45 32,50 22,45 18,34 22,23" fill="url(#t4_core)" stroke="#fef08a" stroke-width="1.2"/>
    
    <!-- Central Golden Eagle / Diamond Star -->
    <polygon points="32,24 35,31 42,34 35,37 32,44 29,37 22,34 29,31" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <circle cx="32" cy="34" r="2.5" fill="#fef08a"/>
  </g>
</svg>
