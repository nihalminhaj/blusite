<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="t3_platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="t3_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="t3_core" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="t3_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#t3_glow)">
    <!-- 8-pointed star base -->
    <path d="M 32 2 L 40 22 L 62 22 L 44 36 L 50 58 L 32 44 L 14 58 L 20 36 L 2 22 L 24 22 Z" 
          fill="url(#t3_platinum)" stroke="url(#t3_rim)" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Inner diamond facet -->
    <polygon points="32,12 48,32 32,52 16,32" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="32,16 44,32 32,48 20,32" fill="url(#t3_core)" stroke="#ffffff" stroke-width="1.2"/>
    
    <!-- Central starburst gem -->
    <circle cx="32" cy="32" r="5" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="2" fill="#ffffff"/>
  </g>
</svg>
